name: E2E Smoke Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Diario a las 06:00 UTC (03:00 ARG) - detecta regresiones de producto
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend/canntrace-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/canntrace-app/package-lock.json

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run smoke tests (contra prod)
        env:
          E2E_BASE_URL: https://canntrace.pages.dev
        run: npm run test:e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/canntrace-app/playwright-report/
          retention-days: 14
