name: E2E Smoke Tests

# Estos tests corren contra una instalacion desplegada. Este repositorio es la
# version publica de un sistema que se desarrollo y nunca llego a implementarse:
# no hay una URL viva contra la cual correrlos. Por eso el workflow es manual y
# pide la direccion a mano, en vez de fallar todos los dias contra un dominio
# que ya no resuelve.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL de la instalacion a testear (ej: https://mi-instancia.pages.dev)'
        required: true
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend/canntrace-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/canntrace-app/package-lock.json

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run smoke tests
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
        run: npm run test:e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/canntrace-app/playwright-report/
          retention-days: 14
