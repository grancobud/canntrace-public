    valor de comprobacion: datos_extra.valor_comprobacion
    # 'resultado de comprobacion' es texto largo (>50 chars), no entra en varchar(50). Va a datos_extra.
    resultado de comprobacion: datos_extra.resultado_comprobacion
    recomendaciones aplicadas: observaciones
    responsable revision: responsable
    documento relacionado: datos_extra.documento_relacionado

CM-RE-0801:
