# Mapeo xlsx CM-RE-XXXX -> tabla operativa Postgres.
# Cada entrada documenta:
#   table          : tabla destino registros_*
#   tipo           : valor para columna 'tipo' (discriminator dentro de la tabla)
#   header_keywords: terminos a buscar en una fila para identificarla como header
#                    (>=2 matches case/accent-insensitive => esa es la fila header)
#   columns        : { etiqueta_xlsx_normalizada: nombre_columna_bd_o_'datos_extra.subkey' }
#                    Las claves se normalizan (lowercase + strip + sin acentos + sin espacios extra)
#                    Si el valor empieza con 'datos_extra.' va al jsonb.
#   defaults       : valores fijos a setear (ej. fecha si la xlsx no la trae)
#
# Hojas no listadas aca van solo a xlsx_raw_rows (captura cruda). Nada se pierde.

CM-RE-0601:
  table: registros_cosecha
  tipo: certificado_cosecha
  header_keywords: ['fecha emision', 'plantas cosechadas', 'fecha cosecha']
  columns:
    fecha emision: fecha
    fila: fila
    fecha transplante: fecha_transplante
    fecha cosecha: fecha_cosecha
    plantas cosechadas: plantas_cosechadas
    estado producto: estado_producto
    ubicacion cultivo: ubicacion_cultivo
    sala cultivo: sala
    camada: camada
    genetica: genetica
    cumple bpa: cumple_bpa
    cond sanitaria: cond_sanitaria
    observaciones sanitarias: obs_sanitarias
    instrumental: instrumental

CM-RE-0605:
  table: registros_cosecha
  tipo: recepcion_secado
  header_keywords: ['fecha recepcion', 'cantidad recibida', 'cuadro de secado']
  columns:
    fecha recepcion: fecha_recepcion
    nombre lote: codigo_lote
    fecha cosecha: fecha_cosecha
    cantidad recibida: cantidad_recibida
    estado producto: estado_producto
    area entrega: datos_extra.area_entrega
    responsable entrega: responsable_entrega
    fecha traslado: fecha_traslado
    condicion recepcion: cond_recepcion
    cuadro de secado: cuadro_secado
    observaciones: observaciones
    responsable recepcion sec: responsable_recepcion
    codigo trazabilidad cosec: cod_traza_cosecha
    codigo trazabilidad secad: cod_traza_secado

CM-RE-0701:
  table: registros_mantenimiento
  tipo: calibracion_balanza
  header_keywords: ['fecha registro', 'proxima revision', 'marca']
  columns:
    fecha registro: fecha_mantenimiento
    proxima revision: proxima_fecha
    direccion: equipo_ubicacion
    marca: equipo_nombre
    modelo: datos_extra.modelo
